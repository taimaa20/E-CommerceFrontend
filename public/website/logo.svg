<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" fill="none" aria-label="Sando Box">
  <!-- Top ketchup squiggle -->
  <path d="M40 36 Q 75 12 115 28 T 195 28 T 275 28 T 330 34"
        stroke="#e8332a" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Red base plate / ellipse behind "Sando" -->
  <ellipse cx="180" cy="104" rx="150" ry="14" fill="#e8332a"/>

  <!-- SANDO -->
  <g font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="88" fill="#111111" letter-spacing="-3">
    <text x="180" y="100" text-anchor="middle">Sando</text>
  </g>

  <!-- BOX — the "O" replaced with a red open-box mark -->
  <g font-family="Geist, 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="96" fill="#111111" letter-spacing="-4">
    <text x="110" y="188" text-anchor="middle">B</text>
    <text x="250" y="188" text-anchor="middle">X</text>
  </g>

  <!-- Red "O" as a stylized box -->
  <g transform="translate(142 120)">
    <rect x="4" y="12" width="74" height="60" rx="18" fill="#e8332a"/>
    <rect x="12" y="4" width="58" height="16" rx="6" fill="#e8332a"/>
    <rect x="20" y="30" width="42" height="26" rx="8" fill="#ffffff"/>
  </g>
</svg>
